server:
  port: ${PORT:8080}

spring:
  application:
    name: kutatela-mama

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:kutatela.db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ao.co.kutatelamama.config.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:mock_key}
    url: ${DEEPSEEK_URL:https://api.deepseek.com/v1/chat/completions}

kutatela:
  africastalking:
    username: ${AFRICASTALKING_USERNAME:sandbox}
    api-key: ${AFRICASTALKING_API_KEY:sandbox_key}
    short-code: ${AFRICASTALKING_SHORT_CODE:*384*23898#}
    sender-id: ${AFRICASTALKING_SENDER_ID:KUTATELA}
    enabled: ${AFRICASTALKING_ENABLED:false}
  ai:
    deepseek-api-key: ${DEEPSEEK_API_KEY:mock_key}
    deepseek-url: ${DEEPSEEK_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${AI_MODEL:deepseek-chat}
    temperature: 0.2
  gowa:
    api-url: ${GOWA_API_URL:https://go-whatsapp-web-multidevice-production-4328.up.railway.app}
    device-id: ${GOWA_DEVICE_ID:kutatela_mama}
    enabled: ${GOWA_ENABLED:true}
