server:
  port: ${PORT:8080}

spring:
  application:
    name: kutatela-mama

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:kutateladb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

kutatela:
  africastalking:
    username: ${AFRICASTALKING_USERNAME:sandbox}
    api-key: ${AFRICASTALKING_API_KEY:sandbox_key}
    short-code: ${AFRICASTALKING_SHORT_CODE:*123#}
    sender-id: ${AFRICASTALKING_SENDER_ID:KUTATELA}
    enabled: ${AFRICASTALKING_ENABLED:false}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:mock_key}
    model: ${AI_MODEL:gemini-1.5-flash}
    temperature: 0.2
