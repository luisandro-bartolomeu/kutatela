version: '3.8'

services:
  # Kutatela Mama Application (Spring Boot REST API + USSD Gateway)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: luisandrobartolomeu/kutatela-mama:latest
    container_name: kutatela_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:file:./data/kutateladb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.h2.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-sandbox_key}
      AFRICASTALKING_ENABLED: ${AFRICASTALKING_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-mock_key}
      GOWA_API_URL: ${GOWA_API_URL:-http://whatsapp:3000}
      GOWA_ENABLED: ${GOWA_ENABLED:-true}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - h2_data:/app/data
    depends_on:
      - whatsapp

  # GoWA Engine (WhatsApp REST API - Docker Service)
  whatsapp:
    image: aldinokem/gowa:latest
    container_name: kutatela_whatsapp
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-http://app:8080/api/v1/whatsapp/webhook}
    volumes:
      - gowa_data:/app/db

  # Optional PostgreSQL Database (Use if required for external production DB)
  db:
    image: postgres:16-alpine
    container_name: kutatela_db
    restart: always
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kutatela_db}
      POSTGRES_USER: ${POSTGRES_USER:-kutatela_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kutatela_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  h2_data:
  gowa_data:
  postgres_data:

